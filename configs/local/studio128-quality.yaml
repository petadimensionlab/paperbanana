# shinjimac-studio (128GB) as a Tailnet Ollama server: highest-quality profile.
# Requires the pb-quality alias (FROM qwen3.5:122b-a10b, PARAMETER num_ctx 32768).
# Rendering stays on the client Mac; only prompts and reference images cross Tailnet.
vlm:
  provider: ollama
  model: pb-quality
  ollama_model: pb-quality
  ollama_base_url: http://100.127.45.60:11434/v1
  ollama_json_mode: true
  ollama_reasoning_effort: none
  ollama_image_max_edge: 1024

image:
  provider: none

pipeline:
  render_mode: ir_quality
  refinement_iterations: 3
  auto_refine: true
  max_iterations: 3
  num_retrieval_examples: 6
  optimize_inputs: true
  output_resolution: 2k
  num_candidates: 1
  venue: neurips
  vector_export: both

output:
  dir: outputs
  format: png
  vector_export: both
  export_tikz: true
  save_iterations: true
  save_prompts: false
