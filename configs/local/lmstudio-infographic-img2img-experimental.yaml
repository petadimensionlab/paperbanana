# EXPERIMENTAL: LM Studio Qwen3.6-35B + local img2img styling.
# Requires mflux; set MFLUX_BIN=/tmp/mflux-venv/bin/mflux-generate-flux2.
# FLUX.2 img2img can shift boxes, so the exact SVG text overlay may no longer
# line up. Keep infographic_img2img=false for production figures; use this only
# to evaluate local style passes.
vlm:
  provider: routing
  routing:
    default:
      provider: lmstudio
      base_url: http://127.0.0.1:1234/v1
      model: qwen/qwen3.6-35b-a3b
      json_mode: false
      reasoning_effort: none
      image_max_edge: 1280
    planner:
      provider: lmstudio
      base_url: http://127.0.0.1:1234/v1
      model: qwen/qwen3.6-35b-a3b
      json_mode: false
      reasoning_effort: none
      image_max_edge: 1280
    critic:
      provider: lmstudio
      base_url: http://127.0.0.1:1234/v1
      model: qwen/qwen3.6-35b-a3b
      json_mode: false
      reasoning_effort: none
      image_max_edge: 1280
    ir_critic:
      provider: lmstudio
      base_url: http://127.0.0.1:1234/v1
      model: qwen/qwen3.6-35b-a3b
      json_mode: false
      reasoning_effort: none
      image_max_edge: 1280
    retriever:
      provider: lmstudio
      base_url: http://127.0.0.1:1234/v1
      model: qwen/qwen3.6-35b-a3b
      json_mode: false
      reasoning_effort: none
    stylist:
      provider: lmstudio
      base_url: http://127.0.0.1:1234/v1
      model: qwen/qwen3.6-35b-a3b
      json_mode: false
      reasoning_effort: none
    structurer:
      provider: lmstudio
      base_url: http://127.0.0.1:1234/v1
      model: qwen/qwen3.6-35b-a3b
      json_mode: false
      reasoning_effort: none
    fast_ir:
      provider: lmstudio
      base_url: http://127.0.0.1:1234/v1
      model: qwen/qwen3.6-35b-a3b
      json_mode: false
      reasoning_effort: none
    fallback:
      provider: ollama
      base_url: http://127.0.0.1:11434/v1
      model: qwen3.5:9b
      json_mode: true
      reasoning_effort: none

image:
  provider: none

pipeline:
  render_mode: ir_quality
  render_theme: infographic
  infographic_background: assets/local/watercolor-bg.png
  infographic_icon_dir: assets/local/icons
  infographic_panel_dir: assets/local/panels
  infographic_panel_diffusion: false
  infographic_img2img: true
  infographic_img2img_strength: 0.45
  infographic_img2img_model: flux2-klein-4b
  infographic_show_edge_labels: false
  refinement_iterations: 2
  auto_refine: true
  max_iterations: 2
  num_retrieval_examples: 4
  optimize_inputs: true
  output_resolution: 2k
  num_candidates: 1
  venue: neurips
  vector_export: both

output:
  dir: outputs
  format: png
  vector_export: both
  export_tikz: false
  save_iterations: true
  save_prompts: false
