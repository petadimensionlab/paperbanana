# DGX Spark (GB10, 128GB): vLLM FP8 server (OpenAI-compatible).
# Start vLLM with Qwen/Qwen3.5-35B-A3B-FP8 on port 8000; do NOT enable
# --enable-chunked-prefill (SSM+MoE regression on GB10).
# Requires: pip install -e '.[openai]'
vlm:
  provider: openai_local
  model: Qwen/Qwen3.5-35B-A3B-FP8
  openai_local_base_url: http://127.0.0.1:8000/v1
  openai_local_json_mode: true

image:
  provider: none

pipeline:
  render_mode: ir_quality
  refinement_iterations: 3
  auto_refine: true
  max_iterations: 3
  num_retrieval_examples: 6
  optimize_inputs: true
  output_resolution: 2k
  num_candidates: 1
  venue: neurips
  vector_export: both

output:
  dir: outputs
  format: png
  vector_export: both
  export_tikz: true
  save_iterations: true
  save_prompts: false
