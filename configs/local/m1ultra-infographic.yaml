# M1 Ultra Studio 128GB (100.127.45.60) via Ollama: rich infographic theme.
# Deterministic 16:9 SVG/PDF with exact labels, pastel panels, title, and icons.
vlm:
  provider: routing
  routing:
    default:
      provider: ollama
      base_url: http://100.127.45.60:11434/v1
      model: gemma4:12b
      json_mode: true
      reasoning_effort: none
      image_max_edge: 1024
    fast_ir:
      provider: ollama
      base_url: http://100.127.45.60:11434/v1
      model: gemma4:12b
      json_mode: true
      reasoning_effort: none
    fallback:
      provider: ollama
      base_url: http://127.0.0.1:11434/v1
      model: qwen3.5:9b
      json_mode: true
      reasoning_effort: none

image:
  provider: none

pipeline:
  render_mode: ir_quality
  render_theme: infographic
  infographic_background: assets/local/watercolor-bg.png
  infographic_show_edge_labels: false
  refinement_iterations: 1
  auto_refine: false
  num_retrieval_examples: 2
  optimize_inputs: false
  output_resolution: 1k
  num_candidates: 1
  venue: neurips
  vector_export: both

output:
  dir: outputs
  format: png
  vector_export: both
  export_tikz: false
  save_iterations: true
  save_prompts: false
